  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #DDDDDD;
      background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .stretch {
      display: block;
      width: 100%;
      height: 100%;
    }

    .cover {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>

  <!-- Eruda mobile debugger — dimuat saat tombol Debug Info ditekan atau ada error -->
  <script id="debug-panel-script">
    (function () {
      var _loading = false;
      var _earlyErrors = [];
      var _CRASH_KEY = 'pwa_crash_log';

      // Simpan error ke localStorage agar tetap ada setelah app restart
      function _persist(label, msg) {
        try {
          var logs = JSON.parse(localStorage.getItem(_CRASH_KEY) || '[]');
          var full = label + ': ' + msg;
          var last = logs[logs.length - 1];
          if (last && last.msg === full) {
            last.ts = Date.now();
            last.count = (last.count || 1) + 1;
          } else {
            logs.push({ ts: Date.now(), msg: full });
            if (logs.length > 50) logs = logs.slice(-50);
          }
          localStorage.setItem(_CRASH_KEY, JSON.stringify(logs));
        } catch (_) { }
      }

      function _load(cb) {
        if (window.eruda) { cb(); return; }
        if (_loading) {
          var t = setInterval(function () {
            if (window.eruda) { clearInterval(t); cb(); }
          }, 50);
          return;
        }
        _loading = true;
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/eruda';
        s.onload = function () {
          eruda.init();
          _earlyErrors.forEach(function (msg) { console.error(msg); });
          _earlyErrors = [];
          cb();
        };
        s.onerror = function () {
          console.warn('[debug] Gagal load Eruda — periksa koneksi internet');
        };
        document.head.appendChild(s);
      }

      // Saat app restart setelah crash, baca log sesi sebelumnya dari localStorage
      window.addEventListener('load', function () {
        try {
          var saved = JSON.parse(localStorage.getItem(_CRASH_KEY) || '[]');
          if (saved.length === 0) return;
          // Tandai Flutter bahwa ada crash log sebelumnya (tombol Debug Info bisa badge)
          window._hasPrevCrashLog = true;
          _load(function () {
            eruda.show();
            console.warn('[CRASH LOG] ' + saved.length + ' error dari sesi sebelumnya (ketik clearCrashLog() untuk hapus):');
            saved.forEach(function (e) {
              var time = new Date(e.ts).toLocaleString('id-ID', { dateStyle: 'short', timeStyle: 'medium' });
              console.error('[' + time + '] ' + e.msg);
            });
          });
        } catch (_) { }
      });

      // Auto-show saat ada JS error
      window.addEventListener('error', function (e) {
        // Skip error tanpa pesan — biasanya Flutter internal noise dari native JS API
        if (!e.message) return;
        var msg = e.message + ' @ ' + (e.filename || '?') + ':' + e.lineno;
        _persist('JS', msg);
        if (window.eruda) {
          eruda.show();
        } else {
          _earlyErrors.push(msg);
          _load(function () { eruda.show(); });
        }
      });

      window.addEventListener('unhandledrejection', function (e) {
        var reason = e.reason ? (e.reason.message || String(e.reason)) : 'unknown';
        var msg = 'PROMISE REJECT: ' + reason;
        // Firebase messaging/unsupported-browser: SDK memang tidak support iOS, bukan error kita
        var isFirebaseWarning = reason.indexOf('unsupported-browser') !== -1;
        // Geolocation errors: izin ditolak / GPS mati — bukan crash app, jangan restart
        var isGeoError = /geolocation|user denied|origin does not have permission|position unavailable/i.test(reason);
        // Dio timeout: koneksi/server lambat, bukan crash app — jangan munculkan panel debug
        var isDioTimeout = /dioexceptiontype\.(connectionTimeout|sendTimeout|receiveTimeout)|took longer than.*to (receive|send) data/i.test(reason);
        if (isFirebaseWarning || isGeoError || isDioTimeout) return; // abaikan sepenuhnya
        _persist('PROMISE', msg);
        if (window.eruda) {
          eruda.show();
        } else {
          _earlyErrors.push(msg);
          _load(function () { eruda.show(); });
        }
      });

      // Dipanggil dari tombol "Debug Info" di login Flutter
      window.showDebugPanel = function () {
        _load(function () { eruda.show(); });
      };

      // Ketik di Eruda console untuk hapus log lama
      window.clearCrashLog = function () {
        try { localStorage.removeItem(_CRASH_KEY); } catch (_) { }
        window._hasPrevCrashLog = false;
        console.log('[debug] Crash log dihapus.');
      };

      // Dipanggil dari Dart (FlutterError / PlatformDispatcher) via js_interop
      window.logDebugLine = function (type, msg) {
        var prefixed = '[Dart] ' + msg;
        _persist('DART', msg); // simpan error Dart ke localStorage juga
        if (type === 'error') console.error(prefixed);
        else if (type === 'warn') console.warn(prefixed);
        else console.log(prefixed);
      };
    })();
  </script>
</head>

<body>
  <picture id="splash">
    <img class="center" aria-hidden="true" src="splash/img/logo-splas-screen.gif" alt=""
      style="width: 300px; max-width: 70vw;">
  </picture>


  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async=""></script>

  <script>
    // Dipanggil dari Dart (VersionCheckService) saat versi dari API beda
    // dengan versi yang sedang berjalan — sama seperti mekanisme force
    // update di mobile, tapi untuk web langsung purge cache + reload
    // (tidak ada "download APK" di web).
    window.forcePwaUpdate = function () {
      var tasks = [];
      if ('serviceWorker' in navigator) {
        tasks.push(
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          })
        );
      }
      if (window.caches && caches.keys) {
        tasks.push(
          caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          })
        );
      }
      Promise.all(tasks).catch(function () { }).finally(function () {
        window.location.reload();
      });
    };

    // PWA Install Prompt
    let _pwaInstallPrompt = null;

    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      _pwaInstallPrompt = e;
      console.log('[PWA] Install prompt ready');
      // Notify Flutter immediately via registered callback
      if (typeof window._pwaInstallAvailableCallback === 'function') {
        window._pwaInstallAvailableCallback();
      }
    });

    window.addEventListener('appinstalled', function () {
      _pwaInstallPrompt = null;
      console.log('[PWA] App installed successfully');
      if (typeof window._pwaInstalledCallback === 'function') {
        window._pwaInstalledCallback();
      }
    });

    // Called from Flutter via js_interop to register a callback
    window.registerPwaCallbacks = function (onAvailable, onInstalled) {
      window._pwaInstallAvailableCallback = onAvailable;
      window._pwaInstalledCallback = onInstalled;
      // If prompt already captured before Flutter registered, notify immediately
      if (_pwaInstallPrompt !== null && typeof onAvailable === 'function') {
        onAvailable();
      }
    };

    // Called from Flutter via js_interop
    window.showPwaInstallPrompt = function () {
      if (_pwaInstallPrompt) {
        _pwaInstallPrompt.prompt();
        _pwaInstallPrompt.userChoice.then(function (result) {
          console.log('[PWA] User choice:', result.outcome);
          _pwaInstallPrompt = null;
        });
        return true;
      }
      return false;
    };

    window.isPwaInstallAvailable = function () {
      return _pwaInstallPrompt !== null;
    };

    // True if already running as installed PWA (standalone mode)
    window.isPwaRunningStandalone = function () {
      return window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true;
    };

    // True if user is on iOS Safari (not already installed, not Chrome/Firefox on iOS)
    window.isIosSafari = function () {
      var ua = navigator.userAgent;
      var isIos = /iphone|ipad|ipod/i.test(ua);
      var isSafari = /safari/i.test(ua) && !/chrome|crios|fxios|android/i.test(ua);
      var isStandalone = navigator.standalone === true;
      return isIos && isSafari && !isStandalone;
    };

    // Registrasi service worker sudah ditangani oleh flutter_bootstrap.js
    // (lewat _flutter.loader.load({ serviceWorker: {...} })) yang otomatis
    // pakai cache-busting query (?v=hash). Di sini kita cuma "menumpang"
    // registrasi itu untuk mendeteksi versi baru dan auto-reload,
    // TANPA register() ulang — supaya tidak bentrok scope/URL.
    if ('serviceWorker' in navigator) {
      let _swRefreshing = false;

      // Saat versi baru berhasil ambil alih kontrol halaman, reload sekali
      // supaya user langsung dapat aset/kode terbaru tanpa hapus cache manual.
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (_swRefreshing) return;
        _swRefreshing = true;
        window.location.reload();
      });

      navigator.serviceWorker.ready.then(function (reg) {
        console.log('[PWA] Service worker ready:', reg.scope);

        function activateIfWaiting() {
          if (reg.waiting) reg.waiting.postMessage('skipWaiting');
        }

        // Ada versi baru yang sudah "waiting" dari sesi sebelumnya
        activateIfWaiting();

        // Versi baru terdeteksi sedang di-install saat app berjalan
        reg.addEventListener('updatefound', function () {
          var newWorker = reg.installing;
          if (!newWorker) return;
          newWorker.addEventListener('statechange', function () {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              activateIfWaiting();
            }
          });
        });

        // Cek update langsung tiap kali app dibuka (termasuk PWA yang
        // dibuka dari home screen icon iOS) — jangan andalkan cek
        // otomatis browser yang di iOS standalone kadang tidak jalan.
        reg.update().catch(function () { });

        // iOS PWA jarang benar-benar "ditutup" (cuma di-background), jadi
        // cek update lagi tiap kali app kembali ke foreground...
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') {
            reg.update().catch(function () { });
          }
        });

        // ...dan tiap 15 menit selama app dibiarkan terbuka di foreground
        // (PWA sering dibiarkan menyala seharian tanpa pernah di-background).
        setInterval(function () {
          if (document.visibilityState === 'visible') {
            reg.update().catch(function () { });
          }
        }, 15 * 60 * 1000);
      }).catch(function (err) {
        console.warn('[PWA] Service worker not ready:', err);
      });
    }
  </script>

</body>
