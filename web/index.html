  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #FFFFFF;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }

<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async=""></script>

  <script>
    // PWA Install Prompt
    let _pwaInstallPrompt = null;

    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      _pwaInstallPrompt = e;
      console.log('[PWA] Install prompt ready');
      // Notify Flutter immediately via registered callback
      if (typeof window._pwaInstallAvailableCallback === 'function') {
        window._pwaInstallAvailableCallback();
      }
    });

    window.addEventListener('appinstalled', function () {
      _pwaInstallPrompt = null;
      console.log('[PWA] App installed successfully');
      if (typeof window._pwaInstalledCallback === 'function') {
        window._pwaInstalledCallback();
      }
    });

    // Called from Flutter via js_interop to register a callback
    window.registerPwaCallbacks = function (onAvailable, onInstalled) {
      window._pwaInstallAvailableCallback = onAvailable;
      window._pwaInstalledCallback = onInstalled;
      // If prompt already captured before Flutter registered, notify immediately
      if (_pwaInstallPrompt !== null && typeof onAvailable === 'function') {
        onAvailable();
      }
    };

    // Called from Flutter via js_interop
    window.showPwaInstallPrompt = function () {
      if (_pwaInstallPrompt) {
        _pwaInstallPrompt.prompt();
        _pwaInstallPrompt.userChoice.then(function (result) {
          console.log('[PWA] User choice:', result.outcome);
          _pwaInstallPrompt = null;
        });
        return true;
      }
      return false;
    };

    window.isPwaInstallAvailable = function () {
      return _pwaInstallPrompt !== null;
    };

    // True if already running as installed PWA (standalone mode)
    window.isPwaRunningStandalone = function () {
      return window.matchMedia('(display-mode: standalone)').matches ||
             window.navigator.standalone === true;
    };

    // True if user is on iOS Safari (not already installed, not Chrome/Firefox on iOS)
    window.isIosSafari = function () {
      var ua = navigator.userAgent;
      var isIos = /iphone|ipad|ipod/i.test(ua);
      var isSafari = /safari/i.test(ua) && !/chrome|crios|fxios|android/i.test(ua);
      var isStandalone = navigator.standalone === true;
      return isIos && isSafari && !isStandalone;
    };

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('flutter_service_worker.js')
          .then(function (reg) {
            console.log('[PWA] Service worker registered:', reg.scope);
          })
          .catch(function (err) {
            console.warn('[PWA] Service worker registration failed:', err);
          });
      });
    }
  </script>

</body></html>
