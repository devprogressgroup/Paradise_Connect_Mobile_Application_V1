appId: com.example.progress_group
---
# ============================================================
# Flow 1: Login ke halaman Attendance
# Asumsi: user sudah punya akun valid di staging/dev
# ============================================================

- launchApp:
    clearState: true  # Mulai fresh (logout state)

# Tunggu halaman login muncul
- waitForAnimationToEnd

# Input email / username
- tapOn:
    id: "email_field"  # Sesuaikan dengan key/semantic label di TextField login
- inputText: "juwita"

# Input password
- tapOn:
    id: "password_field"
- inputText: "Progress123"

# Tap tombol login
- tapOn: "Login"

# Tunggu dashboard muncul (setelah login berhasil)
- waitForAnimationToEnd
- assertVisible: "Attendance"  # Nama menu di bottom nav atau dashboard
