appId: com.example.progress_group
---
# ============================================================
# Flow 6: Pull to Refresh di halaman Attendance
# ============================================================

- launchApp
- waitForAnimationToEnd

# Navigasi ke Attendance
- tapOn: "Attendance"
- waitForAnimationToEnd

# Verifikasi halaman terbuka
- assertVisible: "Attendance"

# Lakukan pull-to-refresh (swipe ke bawah dari atas)
- swipe:
    direction: DOWN
    duration: 500

# Tunggu refresh selesai
- waitForAnimationToEnd

# Verifikasi tidak ada error setelah refresh
- runFlow:
    when:
      visible: "Gagal"
    commands:
      - fail: "ERROR: Terjadi error setelah pull-to-refresh"

# Pindah ke Attendance Log dan refresh
- tapOn: "Attendance Log"
- waitForAnimationToEnd

- swipe:
    direction: DOWN
    duration: 500

- waitForAnimationToEnd
