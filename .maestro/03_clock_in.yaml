appId: com.example.progress_group
---
# ============================================================
# Flow 3: Proses Clock In
#
# CATATAN PENTING:
# - Flow ini memerlukan GPS aktif di emulator/device
# - Untuk emulator: set mock location via Android Studio
#   (Tools > Device Manager > Virtual Device > ...)
# - Kamera harus diizinkan di emulator
# - Flow ini TIDAK bisa fully diautomasi karena butuh
#   input kamera (foto selfie). Kita test sampai layar kamera terbuka.
# ============================================================

- launchApp

# Tunggu app load
- waitForAnimationToEnd

# Navigasi ke Attendance
- tapOn: "Attendance"
- waitForAnimationToEnd

# Verifikasi halaman terbuka
- assertVisible: "Attendance"

# Scroll ke bawah untuk melihat kartu Clock In/Activity
- scroll

# Cari tombol Clock In (tab pertama di PageView)
# Berdasarkan kode: index 0 = Clock In
- assertVisible: "Clock In"

# Tap tombol Clock In
# Ini akan memicu permission GPS dan kamera
- tapOn: "Clock In"

# Tunggu proses permission dan kamera terbuka
- waitForAnimationToEnd

# Jika muncul dialog izin lokasi, tap Allow
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
      - waitForAnimationToEnd

# Jika muncul dialog izin kamera, tap Allow  
- runFlow:
    when:
      visible: "Allow only while using the app"
    commands:
      - tapOn: "Allow only while using the app"
      - waitForAnimationToEnd

# Jika muncul snackbar loading kamera, tunggu
- runFlow:
    when:
      visible: "Mohon tunggu, sedang mempersiapkan kamera"
    commands:
      - waitForAnimationToEnd

# Pada titik ini kamera terbuka (tidak bisa auto-capture)
# Verifikasi bahwa tidak ada error
- runFlow:
    when:
      visible: "Gagal membuka kamera"
    commands:
      - fail: "ERROR: Kamera gagal terbuka saat Clock In"
