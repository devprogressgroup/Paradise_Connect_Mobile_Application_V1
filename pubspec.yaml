name: progress_group
description: "A new Flutter project."
publish_to: 'none'
version: 0.6.0+1

environment:
  sdk: ^3.11.4

dependencies:
  camera: ^0.12.0+1
  dartz: ^0.10.1
  equatable: ^2.0.8
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_riverpod: ^2.4.0
  get_it: ^9.2.1
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  intl: ^0.20.2
  webview_flutter: ^4.13.1
  geolocator: ^13.0.1
  geocoding: ^4.0.0
  image_picker: ^1.0.7
  dio: ^5.9.2
  shared_preferences: ^2.5.2
  socket_io_client: ^3.1.4
  video_player: ^2.11.1
  chewie: ^1.13.1
  rxdart: ^0.28.0
  url_launcher: ^6.3.2
  file_picker: ^8.0.0
  share_plus: ^10.1.4
  local_auth: ^2.1.6
  shimmer: ^3.0.0
  flutter_pdfview: ^1.3.2
  path_provider: ^2.1.0
  web: ^1.1.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  flutter_contacts: ^1.1.9+1
  package_info_plus: ^8.0.0
  bloc_concurrency: ^0.3.0
  flutter_image_compress: ^2.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/img/logo-paradise-connect-padded.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/img/logo-paradise-connect-padded.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/img/logo-paradise-connect-padded.png
  android: true
  ios: true
  android_12:
    image: assets/img/logo-paradise-connect-padded.png
    color: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/img/

